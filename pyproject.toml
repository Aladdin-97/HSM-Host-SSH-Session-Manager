[project]
name = "hsm"
version = "0.1.0"
description = "SSH host inventory with an encrypted vault, for macOS"
requires-python = ">=3.12"
dependencies = [
    # AES-GCM and Argon2id (native since 44.0: no argon2-cffi needed).
    "cryptography>=44",
    # Touch ID check (LAContext): there is no equivalent system command,
    # and a hand-written ctypes binding would be more fragile.
    "pyobjc-framework-localauthentication>=11 ; sys_platform == 'darwin'",
    # NSPasteboard for the clipboard: unlike pbcopy, it can mark the password
    # as "do not keep in clipboard history". Already required by
    # LocalAuthentication: declaring it adds no packages.
    "pyobjc-framework-cocoa>=11 ; sys_platform == 'darwin'",
    # Reads/writes hosts.toml preserving hand-written comments.
    "tomlkit>=0.13",
]

[project.scripts]
hsm = "hsm.cli:main"
# Launched by ssh (SSH_ASKPASS) to ask for the password: see askpass.py.
hsm-askpass = "hsm.askpass:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
