[project]
name = "hsm"
version = "0.1.0"
description = "Inventario di host SSH con vault cifrato, per macOS"
requires-python = ">=3.12"
dependencies = [
    # AES-GCM e Argon2id (nativo da 44.0: niente argon2-cffi).
    "cryptography>=44",
    # Legge/scrive hosts.toml preservando i commenti scritti a mano.
    "tomlkit>=0.13",
]

[project.scripts]
hsm = "hsm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
