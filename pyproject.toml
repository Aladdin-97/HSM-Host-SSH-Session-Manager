[project]
name = "hsm"
version = "0.1.0"
description = "Inventario di host SSH con vault cifrato, per macOS"
requires-python = ">=3.12"
dependencies = [
    # AES-GCM e Argon2id (nativo da 44.0: niente argon2-cffi).
    "cryptography>=44",
    # Controllo Touch ID (LAContext): non esiste un comando di sistema
    # equivalente, e scriverne un binding ctypes a mano sarebbe più fragile.
    "pyobjc-framework-localauthentication>=11 ; sys_platform == 'darwin'",
    # NSPasteboard per gli appunti: a differenza di pbcopy permette di marcare
    # la password come "da non salvare in cronologia". Già richiesto da
    # LocalAuthentication: dichiararlo non aggiunge pacchetti.
    "pyobjc-framework-cocoa>=11 ; sys_platform == 'darwin'",
    # Legge/scrive hosts.toml preservando i commenti scritti a mano.
    "tomlkit>=0.13",
]

[project.scripts]
hsm = "hsm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
